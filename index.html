<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Engineering Journey | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060913;--panel:rgba(255,255,255,.055);--line:rgba(140,170,255,.2);--text:#e8edff;--mut:#9aa6c9;--c1:#5ee7ff;--c2:#9b7bff;--sig:#ff6b8a;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vw 50vh at 15% 10%,rgba(94,231,255,.14),transparent),radial-gradient(55vw 55vh at 90% 80%,rgba(155,123,255,.18),transparent),linear-gradient(rgba(140,170,255,.06) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(140,170,255,.06) 1px,transparent 1px) 0 0/48px 48px}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;line-height:1.15}
a{color:var(--c1)}
:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(16px,4vw,48px);background:rgba(6,9,19,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:"Space Grotesk";font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--text)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;font-size:.9rem;padding:7px 12px;border-radius:99px;transition:.2s}
nav a:hover{color:var(--text)}
nav a.on{color:#04101a;background:linear-gradient(90deg,var(--c1),var(--c2));font-weight:600}
#menu{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px;font:inherit}
main{max-width:1080px;margin:0 auto;padding:110px clamp(16px,4vw,32px) 60px}
.page{display:none}.page.on{display:block;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:8px}
.lead{color:var(--mut);max-width:62ch;margin-bottom:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(8px)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;min-height:68vh}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-family:"Space Grotesk";font-size:1.25rem;color:var(--c1);margin:14px 0;min-height:1.8em}
.role::after{content:"";display:inline-block;width:2px;height:1.1em;background:var(--c1);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.btn{display:inline-block;padding:12px 24px;border-radius:99px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--text);margin:8px 10px 0 0;transition:.2s}
.btn.pri{background:linear-gradient(90deg,var(--c1),var(--c2));color:#04101a;border:0;box-shadow:0 0 28px rgba(94,231,255,.35)}
.btn:hover{transform:translateY(-2px)}
.holo{position:relative;width:min(100%,380px);aspect-ratio:1;margin:auto}
.holo::before,.holo::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed var(--c1);opacity:.55;animation:spin 24s linear infinite}
.holo::after{inset:-30px;border-color:var(--c2);animation-duration:38s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.holo img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--c1);box-shadow:0 0 50px rgba(94,231,255,.4),inset 0 0 30px rgba(0,0,0,.4)}
.holo i{position:absolute;left:8%;right:8%;height:2px;top:10%;background:linear-gradient(90deg,transparent,var(--c1),transparent);box-shadow:0 0 14px var(--c1);animation:scan 4.5s ease-in-out infinite}
@keyframes scan{50%{top:88%}}
/* timeline, skills */
.tl{border-left:2px solid var(--line);padding-left:22px;display:grid;gap:18px}
.tl div{position:relative}
.tl div::before{content:"";position:absolute;left:-30px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c1);box-shadow:0 0 12px var(--c1)}
.tl b,.item b{display:block;font-family:"Space Grotesk";font-size:1.1rem}
.muted{color:var(--mut);font-size:.92rem}
.skill{margin-bottom:14px}
.skill span{display:flex;justify-content:space-between;font-size:.93rem;margin-bottom:5px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar em{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.yr{display:inline-block;font-family:"Space Grotesk";font-weight:700;color:#04101a;background:var(--c1);padding:2px 12px;border-radius:99px;font-size:.85rem;margin-bottom:8px}
.pj h3{font-size:1.35rem;margin-bottom:10px}
.pj dl{display:grid;gap:8px}.pj dt{color:var(--c1);font-weight:600;font-size:.9rem}.pj dd{margin:0 0 4px;color:var(--text)}
.status{display:inline-block;background:rgba(255,107,138,.15);color:var(--sig);border-radius:99px;padding:2px 12px;font-size:.82rem;margin-bottom:10px}
/* gallery */
.gal{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.gal figure{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.gal img,.gal .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:grid;place-items:center;color:var(--mut);font-size:.9rem;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px)}
.gal figcaption{padding:12px 14px;font-size:.9rem;color:var(--mut)}
.links{display:grid;gap:12px;margin-top:18px}
.links a{display:block;padding:14px 18px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--text);background:var(--panel);transition:.2s}
.links a:hover{border-color:var(--c1);box-shadow:0 0 22px rgba(94,231,255,.2)}
.links small{display:block;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:24px 16px 40px;border-top:1px solid var(--line)}
@media(max-width:820px){
 .hero{grid-template-columns:1fr;text-align:center;min-height:auto}.holo{order:-1;width:min(70%,280px)}
 #menu{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:rgba(6,9,19,.97);padding:12px 16px;border-bottom:1px solid var(--line)}nav.open{display:flex}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
 <a class="brand" href="#home" id="brand"></a>
 <button id="menu" aria-label="Toggle menu">Menu</button>
 <nav id="nav"></nav>
</header>
<main id="app"></main>
<footer id="foot"></footer>

}

 ci+=del?-1:1;setTimeout(type,del?35:70)})();
